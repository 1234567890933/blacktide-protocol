name: Android arm64 build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug or release"
        default: "debug"
        required: true

# softprops/action-gh-release needs write access; repos default to read-only.
permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"
  ANDROID_API: "34"
  BUILD_TOOLS: "34.0.0"
  PACKAGE_NAME: "com.blacktide.protocol"

jobs:
  build:
    name: Export APK (arm64-v8a only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-templates-linux

      - name: Install Godot and Android export templates
        run: |
          set -e
          mkdir -p ~/godot
          if [ ! -f ~/godot/godot ]; then
            curl -sSL -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -oq /tmp/godot.zip -d ~/godot
            mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
            chmod +x ~/godot/godot
          fi
          if [ ! -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            curl -sSL -o /tmp/templates.tpz \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            mkdir -p /tmp/tpl && unzip -oq /tmp/templates.tpz -d /tmp/tpl
            mkdir -p ~/.local/share/godot/export_templates
            mv /tmp/tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable | head
          ~/godot/godot --version

      # The android-actions/setup-android action is deliberately NOT used: its
      # bundled sdkmanager breaks on newer runner images. Installing the command
      # line tools at a pinned version is deterministic and one less moving part.
      - name: Install Android SDK (pinned cmdline-tools)
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -oq /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-unpack
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmdline-tools-unpack/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept licences and install platform + build tools
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${BUILD_TOOLS}"
          ls -l "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"
          ls -l "$ANDROID_HOME/platforms/android-${ANDROID_API}/android.jar"

      - name: Generate debug keystore
        run: |
          mkdir -p "$HOME/keystore"
          keytool -genkeypair -v \
            -keystore "$HOME/keystore/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Point Godot at the Android SDK
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$SETTINGS"
          printf 'export/android/android_sdk_path = "%s"\n' "$ANDROID_HOME" >> "$SETTINGS"
          printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_HOME" >> "$SETTINGS"
          printf 'export/android/debug_keystore = "%s"\n' "$HOME/keystore/debug.keystore" >> "$SETTINGS"
          printf 'export/android/debug_keystore_user = "androiddebugkey"\n' >> "$SETTINGS"
          printf 'export/android/debug_keystore_pass = "android"\n' >> "$SETTINGS"
          echo "--- editor settings ---"
          cat "$SETTINGS"
          echo "ANDROID_HOME=$ANDROID_HOME  JAVA_HOME=$JAVA_HOME"

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Validate scripts
        run: ~/godot/godot --headless --path . --script tools/validate.gd

      - name: Export APK
        run: |
          set -e
          mkdir -p build
          ~/godot/godot --headless --path . --export-debug "Android" build/blacktide.apk
          ls -lh build/
          test -f build/blacktide.apk

      - name: Verify the APK is 64-bit only
        run: |
          set -e
          APK=build/blacktide.apk
          unzip -l "$APK" | grep -E "lib/" || true
          if unzip -l "$APK" | grep -q "lib/armeabi-v7a/"; then
            echo "::error::32-bit armeabi-v7a libraries found — build must be arm64 only"
            exit 1
          fi
          unzip -l "$APK" | grep -q "lib/arm64-v8a/" || { echo "::error::No arm64-v8a libraries in APK"; exit 1; }
          echo "APK architecture check passed (arm64-v8a only)"
          du -h "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: blacktide-apk-arm64
          path: build/blacktide.apk
          retention-days: 30

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/blacktide.apk
          generate_release_notes: true
